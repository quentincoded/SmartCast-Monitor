; SmartCast mock sock firmware
;   pio run                 build
;   pio run -t upload       build + flash (ESP32 plugged in over USB)
;   pio device monitor      show the JSON lines (Ctrl+C to quit)
;   pio run -e esp32s3 -t upload   for an ESP32-S3 board

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; the Bluetooth stack is large: use the 3 MB app partition
board_build.partitions = huge_app.csv

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; native USB port on S3 boards
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
